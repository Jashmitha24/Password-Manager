<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta-name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Manager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="layout">

        <!-- SIDEBAR -->
        <div class="sidebar">
    <h2>Folders</h2>

    <ul id="folderList">
        <li onclick="selectFolder('All')" class="active">All</li>
        <li onclick="selectFolder('School')">School</li>
        <li onclick="selectFolder('Personal')">Personal</li>
        <li onclick="selectFolder('Family')">Family</li>
    </ul>

    <button id="addFolderBtn" onclick="createFolder()">+ Add Folder</button>
</div>


        <!-- MAIN CONTAINER -->
        <div class="container">
            <h1>Password Manager</h1>

            <form id="passwordForm">
                <div class="form-group">
                    <label for="website">Website:</label>
                    <input type="text" id="website" required>
                </div>

                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" required>
                </div>

                <button type="submit">Add Password</button>
            </form>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search website or username...">
            </div>

            <div id="passwordList" class="password-list">
                <h2>Saved Passwords</h2>
                <ul id="passwords"></ul>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
